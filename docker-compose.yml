version: '3.9'

services:

  postgres:
    image: postgres:16
    container_name: avito_bot_postgres

    environment:
      POSTGRES_DB: avito_bot
      POSTGRES_USER: avito_user
      POSTGRES_PASSWORD: avito_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped

volumes:
  postgres_data: